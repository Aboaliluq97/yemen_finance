workflows:
  default-workflow:
    name: Yemen Finance Build
    max_build_duration: 15
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Setup Flutter Project Structure
        script: |
          echo "جاري تهيئة الهيكل الصافي والمتوافق لنظام الأرقم المالي..."
          mkdir -p lib
          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi
          # تم تصحيح الأمر وحذف أي خيارات ملغية لتهيئة مشروع أندرويد سليم
          flutter create . --platforms=android
      - name: Flutter Packages Get
        script: |
          flutter packages get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
