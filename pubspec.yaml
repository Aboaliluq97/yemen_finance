name: yemen_finance
description: محاسبي الشامل - منصة محاسبة يمنية للأفراد والتجار والأسر والمجموعات
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # فتح WhatsApp والروابط الخارجية.
  url_launcher: ^6.3.1

  # قاعدة بيانات محلية دائمة:
  # الحسابات، الأقسام، العمليات، الديون، الجرد، الأطفال، الخطط.
  sqflite: ^2.4.1

  # إنشاء مسار قاعدة البيانات بطريقة صحيحة.
  path: ^1.9.1

  # حفظ الصور والتقارير والنسخ الاحتياطية داخل مجلد التطبيق.
  path_provider: ^2.1.5

  # حفظ الإعدادات الصغيرة:
  # الوضع الداكن، الرقم السري، الحساب النشط، تنسيق الأرقام.
  shared_preferences: ^2.5.2

  # اختيار صورة شخصية أو شعار أو فاتورة من المعرض أو الكاميرا.
  image_picker: ^1.1.2

  # مشاركة كشف حساب وملف CSV وPDF إلى WhatsApp وغيرها.
  share_plus: ^10.1.4

  # إنشاء تقارير وفواتير PDF.
  pdf: ^3.11.2

  # معاينة وطباعة ومشاركة PDF.
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
