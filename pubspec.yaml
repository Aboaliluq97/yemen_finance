name: yemen_finance
description: محاسبي الشامل - نظام محاسبة شامل للأفراد والتجار والأسر والمجموعات
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.1

  # قاعدة البيانات المحلية الدائمة.
  sqflite: ^2.4.1
  path: ^1.9.1

  # الصور، النسخ الاحتياطي، TXT وCSV وPDF.
  path_provider: ^2.1.5

  # إعدادات التطبيق البسيطة.
  shared_preferences: ^2.5.2

  # الصورة الشخصية، شعار النشاط، وصور الإيصالات.
  image_picker: ^1.1.2

  # المشاركة إلى WhatsApp وبقية التطبيقات.
  share_plus: ^10.1.4

  # تقارير PDF والفواتير.
  pdf: ^3.11.2
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
